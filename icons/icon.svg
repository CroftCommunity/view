<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="View — a window">
  <!-- Maskable: full-bleed background, art kept inside the central safe zone.
       A lit window at night — the "comforting storm" read: warm frame, calm
       horizon through the glass. -->
  <rect width="512" height="512" fill="#12181f" />
  <!-- The glass -->
  <rect x="140" y="120" width="232" height="272" rx="22" fill="#1d2733" />
  <!-- Sky-to-water wash inside the glass -->
  <clipPath id="glass"><rect x="140" y="120" width="232" height="272" rx="22" /></clipPath>
  <g clip-path="url(#glass)">
    <rect x="140" y="120" width="232" height="272" fill="#233042" />
    <!-- horizon line -->
    <rect x="140" y="300" width="232" height="92" fill="#2b3a4d" />
    <rect x="140" y="298" width="232" height="4" fill="#c9d4dc" opacity="0.55" />
    <!-- a small lamp-amber glow, low on the horizon -->
    <circle cx="300" cy="298" r="34" fill="#e8b36b" opacity="0.5" />
  </g>
  <!-- Thin inner frame -->
  <rect x="152" y="132" width="208" height="248" rx="14" fill="none" stroke="#3a4655" stroke-width="4" />
  <!-- The window frame + sill -->
  <rect x="140" y="120" width="232" height="272" rx="22" fill="none" stroke="#e8b36b" stroke-width="12" />
  <rect x="128" y="384" width="256" height="16" rx="8" fill="#e8b36b" />
</svg>
